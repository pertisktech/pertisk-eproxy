on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  build-docker:
    runs-on: docker
    timeout_minutes: 120
    steps:
      - name: docker login
        run: |
          test -n "$CI_REGISTRY" || (echo "CI_REGISTRY is empty" && exit 1)
          test -n "$CI_REGISTRY_USER" || (echo "CI_REGISTRY_USER is empty" && exit 1)
          test -n "$CI_REGISTRY_PASSWORD" || (echo "CI_REGISTRY_PASSWORD is empty" && exit 1)
          echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
          if ! docker buildx inspect mybuilder >/dev/null 2>&1; then
            docker buildx create --use --name mybuilder
          fi
          docker buildx use mybuilder
          docker buildx inspect --bootstrap mybuilder

      - name: build and push docker proxy
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) NATIVE_ARCH=amd64 ;;
            aarch64|arm64) NATIVE_ARCH=arm64 ;;
            *) echo "unsupported runner arch: $(uname -m)" && exit 1 ;;
          esac
          IMAGE_REPO="${PROXY_IMAGE_REPO:-${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}}"
          IMAGE_TAG="${IMAGE_TAG:-proxy-v0.1.${{ secrets.CI_PIPELINE_IID }}}"
          IMAGE="$IMAGE_REPO:$IMAGE_TAG"
          # Registry remote cache disabled by default: gitdev returns HTML for OCI
          # referrers → "failed to decode referrers index: invalid character '<'".
          # Set BUILDX_REGISTRY_CACHE=1 to re-enable once the registry supports referrers
          # (or use a cache backend that does). Builder-local layer cache still applies.
          BUILDX_REGISTRY_CACHE="${BUILDX_REGISTRY_CACHE:-0}"
          CACHE_BASE="${CACHE_IMAGE_PROXY:-${IMAGE_REPO}:proxy-buildcache}"
          BUILD_SEQUENTIAL="${BUILD_SEQUENTIAL:-1}"
          COMMON_ARGS="--provenance=false --sbom=false \
            --build-arg BUILDPLATFORM=linux/$NATIVE_ARCH \
            --build-arg BUILDARCH=$NATIVE_ARCH"
          cache_flags() {
            local ref="$1"
            if [ "$BUILDX_REGISTRY_CACHE" = "1" ]; then
              echo "--cache-from" "type=registry,ref=${ref}" \
                "--cache-to" "type=registry,ref=${ref},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
            fi
          }
          if [ "$BUILD_SEQUENTIAL" = "1" ]; then
            echo "BUILD_SEQUENTIAL=1: building linux/amd64 then linux/arm64 (registry_cache=${BUILDX_REGISTRY_CACHE})"
            SRCS=""
            for p in linux/amd64 linux/arm64; do
              SUFFIX="${p#linux/}"
              PTAG="$IMAGE_REPO:$IMAGE_TAG-$SUFFIX"
              CACHE_REF="${CACHE_BASE}-${SUFFIX}"
              echo "==> buildx platform=$p tag=$PTAG"
              # shellcheck disable=SC2046
              docker buildx build \
                --platform "$p" \
                $COMMON_ARGS \
                $(cache_flags "$CACHE_REF") \
                -f docker/Dockerfile.proxy \
                -t "$PTAG" \
                --push .
              SRCS="$SRCS $PTAG"
            done
            docker buildx imagetools create -t "$IMAGE" $SRCS
          else
            # shellcheck disable=SC2046
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              $COMMON_ARGS \
              $(cache_flags "$CACHE_BASE") \
              -t "$IMAGE" \
              -f docker/Dockerfile.proxy \
              --push .
          fi

      - name: build and push docker ingress
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) NATIVE_ARCH=amd64 ;;
            aarch64|arm64) NATIVE_ARCH=arm64 ;;
            *) echo "unsupported runner arch: $(uname -m)" && exit 1 ;;
          esac
          IMAGE_REPO="${INGRESS_IMAGE_REPO:-${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}}"
          IMAGE_TAG="${IMAGE_TAG:-ingress-v0.1.${{ secrets.CI_PIPELINE_IID }}}"
          IMAGE="$IMAGE_REPO:$IMAGE_TAG"
          # Registry remote cache disabled by default (see proxy step).
          BUILDX_REGISTRY_CACHE="${BUILDX_REGISTRY_CACHE:-0}"
          CACHE_BASE="${CACHE_IMAGE_INGRESS:-${IMAGE_REPO}:ingress-buildcache}"
          BUILD_SEQUENTIAL="${BUILD_SEQUENTIAL:-1}"
          COMMON_ARGS="--provenance=false --sbom=false \
            --build-arg BUILDPLATFORM=linux/$NATIVE_ARCH \
            --build-arg BUILDARCH=$NATIVE_ARCH"
          cache_flags() {
            local ref="$1"
            if [ "$BUILDX_REGISTRY_CACHE" = "1" ]; then
              echo "--cache-from" "type=registry,ref=${ref}" \
                "--cache-to" "type=registry,ref=${ref},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
            fi
          }
          if [ "$BUILD_SEQUENTIAL" = "1" ]; then
            echo "BUILD_SEQUENTIAL=1: building linux/amd64 then linux/arm64 (registry_cache=${BUILDX_REGISTRY_CACHE})"
            SRCS=""
            for p in linux/amd64 linux/arm64; do
              SUFFIX="${p#linux/}"
              PTAG="$IMAGE_REPO:$IMAGE_TAG-$SUFFIX"
              CACHE_REF="${CACHE_BASE}-${SUFFIX}"
              echo "==> buildx platform=$p tag=$PTAG"
              # shellcheck disable=SC2046
              docker buildx build \
                --platform "$p" \
                $COMMON_ARGS \
                $(cache_flags "$CACHE_REF") \
                -f docker/Dockerfile.ingress \
                -t "$PTAG" \
                --push .
              SRCS="$SRCS $PTAG"
            done
            docker buildx imagetools create -t "$IMAGE" $SRCS
          else
            # shellcheck disable=SC2046
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              $COMMON_ARGS \
              $(cache_flags "$CACHE_BASE") \
              -t "$IMAGE" \
              -f docker/Dockerfile.ingress \
              --push .
          fi
