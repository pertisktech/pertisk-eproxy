on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  build-docker:
    runs-on: docker
    timeout_minutes: 120
    # gitdev returns HTML for OCI referrers; BuildKit still probes after push and fails.
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    steps:
      - name: docker login
        run: |
          test -n "$CI_REGISTRY" || (echo "CI_REGISTRY is empty" && exit 1)
          test -n "$CI_REGISTRY_USER" || (echo "CI_REGISTRY_USER is empty" && exit 1)
          test -n "$CI_REGISTRY_PASSWORD" || (echo "CI_REGISTRY_PASSWORD is empty" && exit 1)
          echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
          if ! docker buildx inspect mybuilder >/dev/null 2>&1; then
            docker buildx create --use --name mybuilder
          fi
          docker buildx use mybuilder
          docker buildx inspect --bootstrap mybuilder

      - name: build and push docker proxy
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) NATIVE_ARCH=amd64 ;;
            aarch64|arm64) NATIVE_ARCH=arm64 ;;
            *) echo "unsupported runner arch: $(uname -m)" && exit 1 ;;
          esac
          IMAGE_REPO="${PROXY_IMAGE_REPO:-${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}}"
          IMAGE_TAG="${IMAGE_TAG:-proxy-v0.1.${{ secrets.CI_PIPELINE_IID }}}"
          IMAGE="$IMAGE_REPO:$IMAGE_TAG"
          BUILD_SEQUENTIAL="${BUILD_SEQUENTIAL:-1}"
          # No registry remote cache — referrers probe fails on this registry.
          # Attestations disabled: BuildKit still GETs /referrers after push otherwise.
          COMMON_ARGS="--provenance=false --sbom=false \
            --attest=type=provenance,disabled=true \
            --attest=type=sbom,disabled=true \
            --build-arg BUILDPLATFORM=linux/$NATIVE_ARCH \
            --build-arg BUILDARCH=$NATIVE_ARCH"

          # Push succeeded but buildx exits non-zero when registry returns HTML for referrers.
          run_buildx_push() {
            local tag="$1"
            shift
            local log
            log="$(mktemp)"
            set +e
            docker buildx build "$@" -t "$tag" --push . 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then
              if grep -q "failed to decode referrers index" "$log" \
                && grep -q "pushing manifest for ${tag}" "$log"; then
                echo "WARN: ignoring registry referrers quirk after successful push of ${tag}"
              else
                rm -f "$log"
                exit "$rc"
              fi
            fi
            rm -f "$log"
          }

          create_manifest() {
            local dest="$1"
            shift
            local log
            log="$(mktemp)"
            set +e
            docker buildx imagetools create -t "$dest" "$@" 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then
              if grep -q "failed to decode referrers index" "$log"; then
                echo "WARN: imagetools hit referrers quirk; falling back to docker manifest"
                docker manifest rm "$dest" 2>/dev/null || true
                # shellcheck disable=SC2068
                docker manifest create "$dest" $@
                docker manifest push "$dest"
              else
                rm -f "$log"
                exit "$rc"
              fi
            fi
            rm -f "$log"
          }

          if [ "$BUILD_SEQUENTIAL" = "1" ]; then
            echo "BUILD_SEQUENTIAL=1: building linux/amd64 then linux/arm64"
            SRCS=""
            for p in linux/amd64 linux/arm64; do
              SUFFIX="${p#linux/}"
              PTAG="$IMAGE_REPO:$IMAGE_TAG-$SUFFIX"
              echo "==> buildx platform=$p tag=$PTAG"
              run_buildx_push "$PTAG" \
                --platform "$p" \
                $COMMON_ARGS \
                -f docker/Dockerfile.proxy
              SRCS="$SRCS $PTAG"
            done
            # shellcheck disable=SC2086
            create_manifest "$IMAGE" $SRCS
          else
            run_buildx_push "$IMAGE" \
              --platform linux/amd64,linux/arm64 \
              $COMMON_ARGS \
              -f docker/Dockerfile.proxy
          fi

      - name: build and push docker ingress
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) NATIVE_ARCH=amd64 ;;
            aarch64|arm64) NATIVE_ARCH=arm64 ;;
            *) echo "unsupported runner arch: $(uname -m)" && exit 1 ;;
          esac
          IMAGE_REPO="${INGRESS_IMAGE_REPO:-${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}}"
          IMAGE_TAG="${IMAGE_TAG:-ingress-v0.1.${{ secrets.CI_PIPELINE_IID }}}"
          IMAGE="$IMAGE_REPO:$IMAGE_TAG"
          BUILD_SEQUENTIAL="${BUILD_SEQUENTIAL:-1}"
          COMMON_ARGS="--provenance=false --sbom=false \
            --attest=type=provenance,disabled=true \
            --attest=type=sbom,disabled=true \
            --build-arg BUILDPLATFORM=linux/$NATIVE_ARCH \
            --build-arg BUILDARCH=$NATIVE_ARCH"

          run_buildx_push() {
            local tag="$1"
            shift
            local log
            log="$(mktemp)"
            set +e
            docker buildx build "$@" -t "$tag" --push . 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then
              if grep -q "failed to decode referrers index" "$log" \
                && grep -q "pushing manifest for ${tag}" "$log"; then
                echo "WARN: ignoring registry referrers quirk after successful push of ${tag}"
              else
                rm -f "$log"
                exit "$rc"
              fi
            fi
            rm -f "$log"
          }

          create_manifest() {
            local dest="$1"
            shift
            local log
            log="$(mktemp)"
            set +e
            docker buildx imagetools create -t "$dest" "$@" 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then
              if grep -q "failed to decode referrers index" "$log"; then
                echo "WARN: imagetools hit referrers quirk; falling back to docker manifest"
                docker manifest rm "$dest" 2>/dev/null || true
                # shellcheck disable=SC2068
                docker manifest create "$dest" $@
                docker manifest push "$dest"
              else
                rm -f "$log"
                exit "$rc"
              fi
            fi
            rm -f "$log"
          }

          if [ "$BUILD_SEQUENTIAL" = "1" ]; then
            echo "BUILD_SEQUENTIAL=1: building linux/amd64 then linux/arm64"
            SRCS=""
            for p in linux/amd64 linux/arm64; do
              SUFFIX="${p#linux/}"
              PTAG="$IMAGE_REPO:$IMAGE_TAG-$SUFFIX"
              echo "==> buildx platform=$p tag=$PTAG"
              run_buildx_push "$PTAG" \
                --platform "$p" \
                $COMMON_ARGS \
                -f docker/Dockerfile.ingress
              SRCS="$SRCS $PTAG"
            done
            # shellcheck disable=SC2086
            create_manifest "$IMAGE" $SRCS
          else
            run_buildx_push "$IMAGE" \
              --platform linux/amd64,linux/arm64 \
              $COMMON_ARGS \
              -f docker/Dockerfile.ingress
          fi
