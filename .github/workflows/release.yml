# Release on version tag v* only: deb/rpm packages, Docker (buildx), Helm chart, GitHub Release.
# CI (unit tests + coverage) runs on main — see ci.yml.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PATH: /usr/lib/erlang/bin:/usr/local/erlang/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PACKAGE_NAME: pertisk-eproxy
  HARBOR_REGISTRY: harbor.tools.thaidevops.co
  HARBOR_PROXY_IMAGE: harbor.tools.thaidevops.co/pertisksoft/pertisk-eproxy/proxy
  HARBOR_INGRESS_IMAGE: harbor.tools.thaidevops.co/pertisksoft/pertisk-eproxy/ingress
  HELM_CHART_REPO_URL: https://chart.cloud.pertisksoft.net
  HELM_CHART_DIR: deploy/helm/pertisk-eproxy

jobs:
  packages:
    name: Packages (${{ matrix.goarch }})
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - goarch: amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - goarch: arm64
            deb_arch: arm64
            rpm_arch: aarch64

    steps:
      - name: Prepare workspace
        run: |
          set -u
          WS="${GITHUB_WORKSPACE}"
          mkdir -p "$WS"
          needs=0
          for p in _build deps _release_export release; do
            [ -e "$WS/$p" ] && needs=1
          done
          [ "$needs" -eq 1 ] || exit 0
          if [ "$(id -u)" -eq 0 ]; then
            rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif sudo -n true 2>/dev/null; then
            sudo rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$WS:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          else
            echo "::warning::cannot remove root-owned build dirs without sudo or docker"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Verify release toolchain
        run: |
          set -euo pipefail
          for cmd in bash docker tar gzip; do
            command -v "$cmd" >/dev/null || { echo "missing required command: $cmd" >&2; exit 127; }
          done
          docker info >/dev/null

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set application version
        run: bash scripts/set-app-version.sh "${{ steps.version.outputs.VERSION }}"

      - name: Build Erlang release (linux/${{ matrix.goarch }})
        run: |
          set -euo pipefail
          RELEASE_BUILD_FORCE_DOCKER=1 \
          RELEASE_BUILD_PLATFORM="linux/${{ matrix.goarch }}" \
          COWBOY_QUICER=1 COWBOY_QUIC=1 \
            bash scripts/build-release-linux.sh

      - name: Create release tarball
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCH="${{ matrix.goarch }}"
          TAR="${{ env.PACKAGE_NAME }}-v${VERSION}-linux-${ARCH}.tar.gz"
          if [ ! -d _build/prod/rel/pertisk_eproxy ]; then
            echo "release missing at _build/prod/rel/pertisk_eproxy (build step may have failed to install on host)" >&2
            ls -la _build 2>/dev/null || echo "_build/ missing"
            exit 1
          fi
          tar -C _build/prod/rel -czf "$TAR" pertisk_eproxy
          ls -lh "$TAR"

      - name: Build DEB and RPM packages (amd64)
        if: matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          bash scripts/build-deb-amd64.sh "${{ env.PACKAGE_NAME }}" "${{ steps.version.outputs.VERSION }}"
          bash scripts/build-rpm-amd64.sh "${{ env.PACKAGE_NAME }}" "${{ steps.version.outputs.VERSION }}"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}
          path: ${{ env.PACKAGE_NAME }}-v${{ steps.version.outputs.VERSION }}-linux-${{ matrix.goarch }}.tar.gz
          retention-days: 1

      - name: Upload DEB and RPM packages
        if: matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}-packages
          path: |
            release/*.deb
            release/*.rpm
          retention-days: 1

      - name: Cleanup workspace permissions
        if: always()
        run: |
          if [ -f scripts/ci-workspace-cleanup.sh ]; then
            bash scripts/ci-workspace-cleanup.sh || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$GITHUB_WORKSPACE:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          fi

  docker:
    name: Docker (multi-arch buildx)
    runs-on: [self-hosted, linux]
    steps:
      - name: Prepare workspace
        run: |
          set -u
          WS="${GITHUB_WORKSPACE}"
          mkdir -p "$WS"
          needs=0
          for p in _build deps _release_export release; do
            [ -e "$WS/$p" ] && needs=1
          done
          [ "$needs" -eq 1 ] || exit 0
          if [ "$(id -u)" -eq 0 ]; then
            rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif sudo -n true 2>/dev/null; then
            sudo rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$WS:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          else
            echo "::warning::cannot remove root-owned build dirs without sudo or docker"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set application version
        run: bash scripts/set-app-version.sh "${{ steps.version.outputs.VERSION }}"

      - name: Disable Docker keychain (macOS CI)
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo '{"credsStore":""}' > "$RUNNER_TEMP/.docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: pertisk-multiarch
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Login to Harbor Registry
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${{ env.DOCKER_CONFIG }}"
          AUTH=$(echo -n "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" | base64)
          REGISTRY="${{ env.HARBOR_REGISTRY }}"
          mkdir -p "$DOCKER_CONFIG"
          echo "{\"auths\":{\"$REGISTRY\":{\"auth\":\"$AUTH\"}},\"credsStore\":\"\",\"credHelpers\":{}}" > "$DOCKER_CONFIG/config.json"

      - name: Build and push proxy + ingress images (buildx)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_PLATFORMS: linux/amd64,linux/arm64
          BUILD_SEQUENTIAL: "1"
          BUILD_PROVENANCE: "false"
          BUILD_SBOM: "false"
          HARBOR_PROXY_IMAGE: ${{ env.HARBOR_PROXY_IMAGE }}
          HARBOR_INGRESS_IMAGE: ${{ env.HARBOR_INGRESS_IMAGE }}
          HARBOR_REGISTRY: ${{ env.HARBOR_REGISTRY }}
          BUILDX_MULTI_BUILDER: pertisk-multiarch
          FRONTEND_BUILD_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${{ env.DOCKER_CONFIG }}"
          docker buildx inspect --bootstrap pertisk-multiarch
          bash build/docker-harbor.sh "${{ steps.version.outputs.VERSION }}"

      - name: Summary
        run: |
          echo "## Docker Images Built and Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** v${{ steps.version.outputs.VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Proxy (standalone)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.HARBOR_PROXY_IMAGE }}:${{ steps.version.outputs.VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.HARBOR_PROXY_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Ingress (Kubernetes controller)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.HARBOR_INGRESS_IMAGE }}:${{ steps.version.outputs.VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.HARBOR_INGRESS_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** linux/amd64, linux/arm64 (buildx + imagetools manifest)" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup workspace permissions
        if: always()
        run: |
          if [ -f scripts/ci-workspace-cleanup.sh ]; then
            bash scripts/ci-workspace-cleanup.sh || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$GITHUB_WORKSPACE:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          fi

  helm:
    name: Helm chart
    needs: docker
    runs-on: [self-hosted, linux]
    steps:
      - name: Prepare workspace
        run: |
          set -u
          WS="${GITHUB_WORKSPACE}"
          mkdir -p "$WS"
          needs=0
          for p in _build deps _release_export release; do
            [ -e "$WS/$p" ] && needs=1
          done
          [ "$needs" -eq 1 ] || exit 0
          if [ "$(id -u)" -eq 0 ]; then
            rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif sudo -n true 2>/dev/null; then
            sudo rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$WS:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          else
            echo "::warning::cannot remove root-owned build dirs without sudo or docker"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        run: |
          set -euo pipefail
          if command -v helm >/dev/null 2>&1; then
            helm version
            exit 0
          fi
          HELM_VERSION="${HELM_VERSION:-3.21.1}"
          HELM_INSTALL_DIR="${HOME}/.local/bin"
          mkdir -p "$HELM_INSTALL_DIR"
          case "$(uname -m)" in
            x86_64|amd64) HELM_ARCH=amd64 ;;
            aarch64|arm64) HELM_ARCH=arm64 ;;
            *)
              echo "unsupported architecture for helm: $(uname -m)" >&2
              exit 1
              ;;
          esac
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz" -o "$TMP/helm.tgz"
          tar -xzf "$TMP/helm.tgz" -C "$TMP"
          install -m 755 "$TMP/linux-${HELM_ARCH}/helm" "$HELM_INSTALL_DIR/helm"
          echo "$HELM_INSTALL_DIR" >> "$GITHUB_PATH"
          helm version

      - name: Publish pertisk-eproxy chart
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          HELM_CHART_REPO_URL: ${{ env.HELM_CHART_REPO_URL }}
          HELM_CHART_TOKEN: ${{ secrets.HELM_CHART_TOKEN }}
          HELM_USER: ${{ secrets.HELM_USER }}
          HELM_PASSWORD: ${{ secrets.HELM_PASSWORD }}
          HARBOR_INGRESS_IMAGE: ${{ env.HARBOR_INGRESS_IMAGE }}
        run: ./build/publish-helm-eproxy.sh

      - name: Summary
        run: |
          echo "## Helm Chart Published" >> "$GITHUB_STEP_SUMMARY"
          echo "**Chart:** pertisk-eproxy ${{ steps.version.outputs.VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Repository:** ${{ env.HELM_CHART_REPO_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Chart page:** ${{ env.HELM_CHART_REPO_URL }}/charts/pertisk-eproxy" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.HARBOR_INGRESS_IMAGE }}:${{ steps.version.outputs.VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "helm repo add pertisk ${{ env.HELM_CHART_REPO_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "helm repo update" >> "$GITHUB_STEP_SUMMARY"
          echo "helm upgrade --install pertisk-eproxy pertisk/pertisk-eproxy \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --version ${{ steps.version.outputs.VERSION }} -n pertisk-eproxy --create-namespace" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup workspace permissions
        if: always()
        run: |
          if [ -f scripts/ci-workspace-cleanup.sh ]; then
            bash scripts/ci-workspace-cleanup.sh || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$GITHUB_WORKSPACE:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          fi

  github-release:
    name: GitHub Release
    needs: [packages, helm]
    runs-on: [self-hosted, linux]
    steps:
      - name: Prepare workspace
        run: |
          set -u
          WS="${GITHUB_WORKSPACE}"
          mkdir -p "$WS"
          needs=0
          for p in _build deps _release_export release; do
            [ -e "$WS/$p" ] && needs=1
          done
          [ "$needs" -eq 1 ] || exit 0
          if [ "$(id -u)" -eq 0 ]; then
            rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif sudo -n true 2>/dev/null; then
            sudo rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$WS:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          else
            echo "::warning::cannot remove root-owned build dirs without sudo or docker"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: List packages
        run: |
          echo "=== packages ==="
          ls -laR packages/ || echo "packages directory not found"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd packages
          shopt -s nullglob
          files=(*.deb *.rpm *.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: |
            packages/*.deb
            packages/*.rpm
            packages/*.tar.gz
            packages/SHA256SUMS.txt
          body: |
            ## Installation

            ### Debian/Ubuntu (x86_64 / amd64)
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/${{ env.PACKAGE_NAME }}_${{ steps.version.outputs.VERSION }}_amd64.deb
            sudo dpkg -i ${{ env.PACKAGE_NAME }}_${{ steps.version.outputs.VERSION }}_amd64.deb
            ```

            ### RHEL/CentOS/Fedora (x86_64)
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm
            sudo rpm -i ${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm
            ```

            ### Binary tarball
            ```bash
            tar -xzf ${{ env.PACKAGE_NAME }}-v${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            cd pertisk_eproxy
            bin/pertisk_eproxy foreground
            ```

            ## Post installation
            ```bash
            sudo systemctl enable pertisk-eproxy --now
            sudo systemctl status pertisk-eproxy
            ```

            ## Docker (Harbor)

            ### Proxy (standalone)
            ```bash
            docker pull ${{ env.HARBOR_PROXY_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ```

            ### Ingress (Kubernetes controller)
            ```bash
            docker pull ${{ env.HARBOR_INGRESS_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ```

            ### Helm (pertisk-eproxy)
            ```bash
            helm repo add pertisk ${{ env.HELM_CHART_REPO_URL }}
            helm repo update
            helm upgrade --install pertisk-eproxy pertisk/pertisk-eproxy \
              --version ${{ steps.version.outputs.VERSION }} -n pertisk-eproxy --create-namespace
            ```

            ## Verify checksums
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
