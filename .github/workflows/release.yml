# Release on push tag v* — Erlang release packages, Harbor images, Helm chart, GitHub Release.

name: Release Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PACKAGE_NAME: pertisk-eproxy
  HARBOR_REGISTRY: harbor.tools.thaidevops.co
  HARBOR_PROXY_IMAGE: harbor.tools.thaidevops.co/pertisksoft/pertisk-eproxy/proxy
  HARBOR_INGRESS_IMAGE: harbor.tools.thaidevops.co/pertisksoft/pertisk-eproxy/ingress
  HELM_OCI_REPO: oci://harbor.tools.thaidevops.co/pertisksoft/helm
  HELM_CHART_DIR: deploy/helm/pertisk-eproxy

jobs:
  build:
    name: Build ${{ matrix.goarch }}
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - goarch: arm64
            deb_arch: arm64
            rpm_arch: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set application version
        run: bash scripts/set-app-version.sh "${{ steps.version.outputs.VERSION }}"

      - name: Build Erlang release (linux/${{ matrix.goarch }})
        run: |
          set -euo pipefail
          RELEASE_BUILD_PLATFORM="linux/${{ matrix.goarch }}" \
          COWBOY_QUICER=1 COWBOY_QUIC=1 \
            bash scripts/build-release-linux.sh

      - name: Create release tarball
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCH="${{ matrix.goarch }}"
          TAR="${{ env.PACKAGE_NAME }}-v${VERSION}-linux-${ARCH}.tar.gz"
          tar -C _build/prod/rel -czf "$TAR" pertisk_eproxy
          ls -lh "$TAR"

      - name: Build DEB and RPM packages (amd64)
        if: matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          make package-deb-amd64 package-rpm-amd64 \
            PACKAGE_NAME="${{ env.PACKAGE_NAME }}" \
            PACKAGE_VERSION="${{ steps.version.outputs.VERSION }}"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}
          path: ${{ env.PACKAGE_NAME }}-v${{ steps.version.outputs.VERSION }}-linux-${{ matrix.goarch }}.tar.gz
          retention-days: 1

      - name: Upload DEB and RPM packages
        if: matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}-packages
          path: |
            release/*.deb
            release/*.rpm
          retention-days: 1

  docker-harbor:
    name: Docker images (multi-arch)
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker
        run: |
          DOCKER_TEMP_DIR="$RUNNER_TEMP/.docker"
          mkdir -p "$DOCKER_TEMP_DIR"
          echo '{"auths":{},"credsStore":"","credHelpers":{}}' > "$DOCKER_TEMP_DIR/config.json"
          echo "DOCKER_CONFIG=$DOCKER_TEMP_DIR" >> "$GITHUB_ENV"

      - name: Login to Harbor Registry
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${{ env.DOCKER_CONFIG }}"
          AUTH=$(echo -n "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" | base64)
          REGISTRY="${{ env.HARBOR_REGISTRY }}"
          mkdir -p "$DOCKER_CONFIG"
          echo "{\"auths\":{\"$REGISTRY\":{\"auth\":\"$AUTH\"}},\"credsStore\":\"\",\"credHelpers\":{}}" > "$DOCKER_CONFIG/config.json"

      - name: Set up Docker Buildx
        run: make docker-buildx-multi-builder

      - name: Build and push proxy + ingress images
        run: |
          set -euo pipefail
          make docker-harbor-multi \
            VERSION="${{ steps.version.outputs.VERSION }}" \
            BUILD_PLATFORMS=linux/amd64,linux/arm64 \
            BUILD_PROVENANCE=false \
            BUILD_SBOM=false

      - name: Summary
        run: |
          echo "## Docker Images Built and Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** v${{ steps.version.outputs.VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Proxy (standalone)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.HARBOR_PROXY_IMAGE }}:${{ steps.version.outputs.VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.HARBOR_PROXY_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Ingress (Kubernetes controller)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.HARBOR_INGRESS_IMAGE }}:${{ steps.version.outputs.VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.HARBOR_INGRESS_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"

  helm-publish:
    name: Publish Helm chart
    needs: docker-harbor
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        run: |
          if command -v helm >/dev/null 2>&1; then
            helm version
            exit 0
          fi
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Login to Harbor OCI registry
        run: |
          set -euo pipefail
          helm registry login "${{ env.HARBOR_REGISTRY }}" \
            -u "${{ secrets.HARBOR_USERNAME }}" \
            -p "${{ secrets.HARBOR_PASSWORD }}"

      - name: Publish pertisk-eproxy chart
        run: |
          bash scripts/release-helm.sh \
            --chart-dir "${{ env.HELM_CHART_DIR }}" \
            --output-dir release/helm \
            --version "${{ steps.version.outputs.VERSION }}" \
            --push \
            --oci-repo "${{ env.HELM_OCI_REPO }}"

      - name: Summary
        run: |
          echo "## Helm Chart Published" >> "$GITHUB_STEP_SUMMARY"
          echo "**Chart:** pertisk-eproxy ${{ steps.version.outputs.VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**OCI repo:** ${{ env.HELM_OCI_REPO }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Ingress image:** \`${{ env.HARBOR_INGRESS_IMAGE }}:${{ steps.version.outputs.VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create Release
    needs: build
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: List packages
        run: |
          echo "=== packages ==="
          ls -laR packages/ || echo "packages directory not found"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd packages
          shopt -s nullglob
          files=(*.deb *.rpm *.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: |
            packages/*.deb
            packages/*.rpm
            packages/*.tar.gz
            packages/SHA256SUMS.txt
          body: |
            ## Installation

            ### Debian/Ubuntu (x86_64 / amd64)
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/${{ env.PACKAGE_NAME }}_${{ steps.version.outputs.VERSION }}_amd64.deb
            sudo dpkg -i ${{ env.PACKAGE_NAME }}_${{ steps.version.outputs.VERSION }}_amd64.deb
            ```

            ### RHEL/CentOS/Fedora (x86_64)
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm
            sudo rpm -i ${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm
            ```

            ### Binary tarball
            ```bash
            tar -xzf ${{ env.PACKAGE_NAME }}-v${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            cd pertisk_eproxy
            bin/pertisk_eproxy foreground
            ```

            ## Post installation
            ```bash
            sudo systemctl enable pertisk-eproxy --now
            sudo systemctl status pertisk-eproxy
            ```

            ## Docker (Harbor)

            ### Proxy (standalone)
            ```bash
            docker pull ${{ env.HARBOR_PROXY_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ```

            ### Ingress (Kubernetes controller)
            ```bash
            docker pull ${{ env.HARBOR_INGRESS_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ```

            ### Helm
            ```bash
            helm pull oci://${{ env.HARBOR_REGISTRY }}/pertisksoft/helm/pertisk-eproxy --version ${{ steps.version.outputs.VERSION }}
            ```

            ## Verify checksums
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
