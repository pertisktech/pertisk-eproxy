# CI on main: unit tests + coverage gate.
# Release (deb/rpm/docker/helm) runs only on version tags — see release.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH: /usr/lib/erlang/bin:/usr/local/erlang/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  COVER_MIN: "80"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: [self-hosted, linux]
    steps:
      - name: Prepare workspace
        run: |
          set -u
          WS="${GITHUB_WORKSPACE}"
          mkdir -p "$WS"
          needs=0
          for p in _build deps _release_export release; do
            [ -e "$WS/$p" ] && needs=1
          done
          [ "$needs" -eq 1 ] || exit 0
          if [ "$(id -u)" -eq 0 ]; then
            rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif sudo -n true 2>/dev/null; then
            sudo rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$WS:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          else
            echo "::warning::cannot remove root-owned build dirs without sudo or docker"
          fi

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Verify Erlang toolchain
        run: bash scripts/ci-verify-erlang.sh

      - name: Patch dependencies
        run: |
          set -euo pipefail
          rebar3 get-deps
          bash scripts/patch-ekub.sh
          bash scripts/patch-quic.sh
          bash scripts/patch-hackney.sh

      - name: Compile
        run: rebar3 compile

      - name: Run unit tests
        run: bash scripts/run-eunit.sh

      - name: Verify H3 param script (syntax)
        run: bash -n scripts/verify_h3_params.sh

      - name: Cleanup workspace permissions
        if: always()
        run: |
          if [ -f scripts/ci-workspace-cleanup.sh ]; then
            bash scripts/ci-workspace-cleanup.sh || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$GITHUB_WORKSPACE:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          fi

  coverage:
    name: Coverage (${{ env.COVER_MIN }}% gate)
    needs: unit-tests
    runs-on: [self-hosted, linux]
    steps:
      - name: Prepare workspace
        run: |
          set -u
          WS="${GITHUB_WORKSPACE}"
          mkdir -p "$WS"
          needs=0
          for p in _build deps _release_export release; do
            [ -e "$WS/$p" ] && needs=1
          done
          [ "$needs" -eq 1 ] || exit 0
          if [ "$(id -u)" -eq 0 ]; then
            rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif sudo -n true 2>/dev/null; then
            sudo rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$WS:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          else
            echo "::warning::cannot remove root-owned build dirs without sudo or docker"
          fi

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Verify Erlang toolchain
        run: bash scripts/ci-verify-erlang.sh

      - name: Patch dependencies
        run: |
          set -euo pipefail
          rebar3 get-deps
          bash scripts/patch-ekub.sh
          bash scripts/patch-quic.sh
          bash scripts/patch-hackney.sh

      - name: Check line coverage
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.coverdata' -delete
          bash scripts/run-eunit.sh --cover
          ROOT_DIR=. scripts/merge-cover.escript \
            _build/test/cover/chunks _build/test/cover/eunit.coverdata "${COVER_MIN}" gate

      - name: Cleanup workspace permissions
        if: always()
        run: |
          if [ -f scripts/ci-workspace-cleanup.sh ]; then
            bash scripts/ci-workspace-cleanup.sh || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$GITHUB_WORKSPACE:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          fi
