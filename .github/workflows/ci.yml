name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Build admin UI
        working-directory: admin
        run: npm ci && npm run build

      - name: Install Playwright
        working-directory: admin
        run: npx playwright install chromium

      - name: Admin UI smoke tests
        working-directory: admin
        run: npm run test:e2e

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint deploy/helm/pertisk-eproxy

      - name: Render production profile
        run: |
          helm template pertisk-eproxy deploy/helm/pertisk-eproxy \
            -f deploy/helm/pertisk-eproxy/values-production.yaml \
            --set auth.password=production-secret-min-12 \
            > /dev/null
