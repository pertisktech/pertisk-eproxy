# CI on main: unit tests + coverage gate.
# Release (deb/rpm/docker/helm) runs only on version tags — see release.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  unit-tests:
    name: Unit tests
    runs-on: [self-hosted, linux]
    steps:
      - name: Prepare workspace
        run: |
          set -u
          WS="${GITHUB_WORKSPACE}"
          mkdir -p "$WS"
          needs=0
          for p in _build deps _release_export release; do
            [ -e "$WS/$p" ] && needs=1
          done
          [ "$needs" -eq 1 ] || exit 0
          if [ "$(id -u)" -eq 0 ]; then
            rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif sudo -n true 2>/dev/null; then
            sudo rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$WS:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          else
            echo "::warning::cannot remove root-owned build dirs without sudo or docker"
          fi

      - uses: actions/checkout@v5
        with:
          clean: false

      - name: Verify Erlang toolchain
        run: |
          set -euo pipefail
          command -v erl >/dev/null
          command -v rebar3 >/dev/null
          otp="$(erl -noshell -eval 'io:format("~s", [erlang:system_info(otp_release)]), halt().')"
          echo "OTP ${otp}, $(erl -noshell -eval 'io:format("~s", [erlang:system_info(system_version)]), halt().')"
          rebar3 version
          case "${otp}" in
            27|28|29) ;;
            *)
              echo "Expected OTP 27, 28, or 29 on the self-hosted runner (got ${otp})." >&2
              exit 1
              ;;
          esac

      - name: Patch dependencies
        run: make patch-ekub patch-quic patch-hackney

      - name: Compile
        run: rebar3 compile

      - name: Run unit tests
        run: make test

      - name: Verify H3 param script (syntax)
        run: bash -n scripts/verify_h3_params.sh

      - name: Cleanup workspace permissions
        if: always()
        run: |
          if [ -f scripts/ci-workspace-cleanup.sh ]; then
            bash scripts/ci-workspace-cleanup.sh || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$GITHUB_WORKSPACE:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          fi

  coverage:
    name: Coverage (80% gate)
    runs-on: [self-hosted, linux]
    steps:
      - name: Prepare workspace
        run: |
          set -u
          WS="${GITHUB_WORKSPACE}"
          mkdir -p "$WS"
          needs=0
          for p in _build deps _release_export release; do
            [ -e "$WS/$p" ] && needs=1
          done
          [ "$needs" -eq 1 ] || exit 0
          if [ "$(id -u)" -eq 0 ]; then
            rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif sudo -n true 2>/dev/null; then
            sudo rm -rf "$WS/_build" "$WS/deps" "$WS/_release_export" "$WS/release" 2>/dev/null || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$WS:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          else
            echo "::warning::cannot remove root-owned build dirs without sudo or docker"
          fi

      - uses: actions/checkout@v5
        with:
          clean: false

      - name: Verify Erlang toolchain
        run: |
          set -euo pipefail
          command -v erl >/dev/null
          command -v rebar3 >/dev/null
          otp="$(erl -noshell -eval 'io:format("~s", [erlang:system_info(otp_release)]), halt().')"
          echo "OTP ${otp}, $(erl -noshell -eval 'io:format("~s", [erlang:system_info(system_version)]), halt().')"
          rebar3 version
          case "${otp}" in
            27|28|29) ;;
            *)
              echo "Expected OTP 27, 28, or 29 on the self-hosted runner (got ${otp})." >&2
              exit 1
              ;;
          esac

      - name: Patch dependencies
        run: make patch-ekub patch-quic patch-hackney

      - name: Check line coverage
        run: make cover
        env:
          COVER_MIN: "80"

      - name: Cleanup workspace permissions
        if: always()
        run: |
          if [ -f scripts/ci-workspace-cleanup.sh ]; then
            bash scripts/ci-workspace-cleanup.sh || true
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$GITHUB_WORKSPACE:/work" alpine:3.20 \
              sh -c 'rm -rf /work/_build /work/deps /work/_release_export /work/release 2>/dev/null; exit 0'
          fi
