name: Unit Test & Coverage

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test-coverage:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      # Use OTP/rebar3 installed on the runner (setup-beam Ubuntu builds fail on
      # RHEL-family hosts: crypto NIF vs system OpenSSL mismatch).
      - name: Verify Erlang toolchain
        run: |
          set -euo pipefail
          command -v erl >/dev/null
          command -v rebar3 >/dev/null
          otp="$(erl -noshell -eval 'io:format("~s", [erlang:system_info(otp_release)]), halt().')"
          echo "OTP ${otp}, $(erl -noshell -eval 'io:format("~s", [erlang:system_info(system_version)]), halt().')"
          rebar3 version
          case "${otp}" in
            27|28) ;;
            *)
              echo "Expected OTP 27 or 28 on the self-hosted runner (got ${otp})." >&2
              exit 1
              ;;
          esac

      - name: Patch dependencies
        run: make patch-ekub patch-quic patch-hackney

      - name: Compile
        run: rebar3 compile

      - name: Unit tests with coverage
        run: make cover

      - name: Verify H3 param script (syntax)
        run: bash -n scripts/verify_h3_params.sh
