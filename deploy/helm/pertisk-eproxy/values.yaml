# Default values for pertisk-eproxy (Kubernetes ingress controller mode).
# Install: helm upgrade --install pertisk-eproxy ./deploy/helm/pertisk-eproxy -n pertisk-eproxy --create-namespace

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 75

image:
  registry: harbor.tools.thaidevops.co
  repository: pertisksoft/pertisk-eproxy/ingress
  tag: "" # defaults to Chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

leaderElection:
  enabled: true
  leaseName: ""
  leaseDurationSeconds: 15
  renewIntervalSeconds: 5

# Ingress controller (ekub watcher + reconciler)
ingress:
  enabled: true
  className: pertisk-eproxy
  # Empty = all namespaces; set to watch a single namespace
  watchNamespace: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

# Runtime JSON (mode ingress). Mounted when controller.configMap.enabled is true.
controller:
  configMap:
    enabled: true
  # Merged into config/ingress.json (see templates/configmap.yaml)
  config:
    mode: ingress
    http_addr: "0.0.0.0"
    # Container ports (like pertisk-rproxy); Service still exposes 80/443/443-udp.
    http_port: 8080
    https_port: 8443
    # UDP/TCP bind inside the pod; Service maps 443 → 8443.
    quic_port: 8443
    # Port in Alt-Svc (what browsers use on the public LB).
    alt_svc_port: 443
    management_addr: "0.0.0.0"
    management_port: 9080
    quic_enabled: false
    h3_api_gateway_enabled: true
    tls_http2_enabled: true
    sites: []
    backends: []

# Writable data/ (K8s TLS PEM cache). Ingress mode does not use SQLite for routing.
persistence:
  enabled: true
  # emptyDir by default; set storageClass for PVC
  storageClass: ""
  size: 1Gi
  mountPath: /opt/pertisk_eproxy/data

extraEnv: []
# - name: PERTISK_K8S_INGRESS_CLASS
#   value: pertisk-eproxy

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

startupProbe:
  httpGet:
    path: /api/ingress/live
    port: management
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 24

livenessProbe:
  httpGet:
    path: /api/ingress/live
    port: management
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/ingress/ready
    port: management
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

service:
  type: LoadBalancer
  httpPort: 80
  httpsPort: 443
  managementPort: 9080
  # HTTP/3 (UDP). Set to null/0 in overrides to disable UDP Service port.
  http3Port: 443
  annotations: {}
  loadBalancerSourceRanges: []
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

metrics:
  serviceMonitor:
    enabled: false
    labels: {}
    path: /api/metrics
    interval: 15s
    scrapeTimeout: 10s
    honorLabels: false
    relabelings: []
    metricRelabelings: []

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1

ingressClassResource:
  enabled: true
  default: false
  controller: pertisk.tech/pertisk-eproxy

# Optional Ingress to expose the management API (viewer-only) via another controller
adminIngress:
  enabled: false
  host: admin.example.com
  tlsSecretName: ""
