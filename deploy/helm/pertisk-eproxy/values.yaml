# Default values for pertisk-eproxy (Kubernetes ingress controller mode).
# Install: helm upgrade --install pertisk-eproxy ./deploy/helm/pertisk-eproxy -n pertisk-eproxy --create-namespace

# HTTP/3 (UDP) needs stable routing to the same pod as the QUIC connection.
# With 3+ replicas behind a cloud LB, Chrome often falls back to HTTP/2 on TCP.
# For reliable H3: use replicaCount: 1, or set service.externalTrafficPolicy: Local,
# or enable hostNetwork on the controller (see examples/cloud/README.md).
replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 75

image:
  registry: harbor.tools.thaidevops.co
  repository: pertisksoft/pertisk-eproxy/ingress
  tag: "0.5.10" # defaults to Chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

leaderElection:
  enabled: true
  leaseName: ""
  leaseDurationSeconds: 15
  renewIntervalSeconds: 5

# Helm history/view in admin UI (ingress mode).
helm:
  enabled: true
  # Helm release namespace (defaults to .Release.Namespace when empty)
  namespace: ""
  # Max history revisions to return
  historyMax: 20

# Ingress controller (ekub watcher + reconciler)
ingress:
  enabled: true
  className: pertisk-eproxy
  # Empty = all namespaces; set to watch a single namespace
  watchNamespace: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

# Runtime JSON (mode ingress). Mounted when controller.configMap.enabled is true.
controller:
  configMap:
    enabled: true
  # Merged into config/ingress.json (see templates/configmap.yaml)
  config:
    mode: ingress
    http_addr: "0.0.0.0"
    # Container ports (like pertisk-rproxy); Service still exposes 80/443/443-udp.
    http_port: 8080
    https_port: 8443
    # UDP/TCP bind inside the pod; Service maps 443 → 8443.
    quic_port: 8443
    # Port in Alt-Svc (what browsers use on the public LB).
    alt_svc_port: 443
    # Keep Alt-Svc short and non-sticky so clients retry H3 after transient failures.
    alt_svc_ma_secs: 300
    alt_svc_persist: false
    management_addr: "0.0.0.0"
    management_port: 9080
    metrics_addr: "0.0.0.0"
    metrics_port: 9090
    quic_enabled: false
    h3_api_gateway_enabled: true
    tls_http2_enabled: true
    # HTTP/3 QUIC throughput (see README high-performance tuning)
    h3_idle_timeout_secs: 300
    h3_keepalive_interval_secs: 20
    h3_quic_pool_size: 8
    h3_max_udp_payload_size: 1472
    h3_pmtu_enabled: true
    h3_max_streams: 2048
    h3_stream_receive_window: 8388608
    h3_conn_receive_window: 67108864
    h3_udp_bind: dual_stack
    # Upstream Gun connection pool (H3 → backend HTTP)
    upstream_pool_size: 256
    upstream_pool_idle_timeout_secs: 90
    upstream_request_timeout_ms: 180000
    health_cache_refresh_ms: 3000
    health_access_log: false
    # health_access_log_sample: 1000
    # SSE / EventSource (e.g. Argo CD /api/v1/stream/*)
    sse_early_flush_enabled: true
    sse_initial_headers_timeout_ms: 5000
    event_stream_heartbeat_ms: 15000
    upstream_stream_request_timeout_ms: 120000
    sites: []
    backends: []

# Writable data/ (K8s TLS PEM cache). Ingress mode does not use SQLite for routing.
persistence:
  enabled: true
  # emptyDir by default; set storageClass for PVC
  storageClass: ""
  size: 1Gi
  mountPath: /opt/pertisk_eproxy/data

# Admin auth for ingress management UI (env-based, no SQLite) — same model as pertisk-rproxy.
auth:
  mode: both
  enabled: true
  createSecret: true
  secretName: ""
  usernameKey: "PERTISK_ADMIN"
  passwordKey: "PERTISK_PASSWORD"
  apiTokenKey: "PERTISK_API_TOKEN"
  signingSecretKey: "PERTISK_AUTH_SIGNING_SECRET"
  username: "admin"
  password: "admin"
  apiToken: ""
  signingSecret: ""

auth0:
  domain: ""
  clientId: ""
  audience: ""
  domainKey: "PERTISK_AUTH0_DOMAIN"
  clientIdKey: "PERTISK_AUTH0_CLIENT_ID"
  audienceKey: "PERTISK_AUTH0_AUDIENCE"

extraEnv: []
# - name: PERTISK_K8S_INGRESS_CLASS
#   value: pertisk-eproxy

resources:
  requests:
    cpu: 1000m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi

startupProbe:
  httpGet:
    path: /api/ingress/live
    port: management
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 24

livenessProbe:
  httpGet:
    path: /api/ingress/live
    port: management
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    # Requires image with pertisk_ingress_status:ready_from_runtime/0 (live sites + TLS).
    # If pods stay 503 on /api/ingress/ready, temporarily set path: /api/ingress/live
    path: /api/ingress/ready
    port: management
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

metrics:
  enabled: true
  addr: "0.0.0.0:9090"
  port: 9090
  serviceMonitor:
    enabled: false
    labels: {}
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
    honorLabels: false
    relabelings: []
    metricRelabelings: []

service:
  type: LoadBalancer
  httpPort: 80
  httpsPort: 443
  managementPort: 9080
  metricsPort: 9090
  # HTTP/3 (UDP). Set to null/0 in overrides to disable UDP Service port.
  http3Port: 443
  annotations: {}
  loadBalancerSourceRanges: []
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  # Set to Local so UDP/TCP from a client tend to hit pods on the same node (helps HTTP/3).
  externalTrafficPolicy: ""

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1

ingressClassResource:
  enabled: true
  default: false
  controller: pertisk.tech/pertisk-eproxy

# Optional Ingress to expose the management API (viewer-only) via another controller
adminIngress:
  enabled: false
  host: admin.example.com
  tlsSecretName: ""
