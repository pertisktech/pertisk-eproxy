{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pertisk-eproxy.fullname" . }}
  labels:
    {{- include "pertisk-eproxy.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pertisk-eproxy.fullname" . }}
  labels:
    {{- include "pertisk-eproxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pertisk-eproxy.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pertisk-eproxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
