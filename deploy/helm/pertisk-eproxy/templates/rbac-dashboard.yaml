{{- if .Values.rbac.create -}}
# Namespaced Role so dashboard pod list works even if an older ClusterRole
# on the cluster was never patched with pods rules (helm upgrade merges ClusterRole
# but some clusters keep stale rules; RoleBinding in-release always applies).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pertisk-eproxy.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pertisk-eproxy.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pertisk-eproxy.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pertisk-eproxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pertisk-eproxy.fullname" . }}-dashboard
subjects:
  - kind: ServiceAccount
    name: {{ include "pertisk-eproxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
