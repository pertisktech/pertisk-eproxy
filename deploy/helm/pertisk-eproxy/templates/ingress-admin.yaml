{{- if .Values.adminIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pertisk-eproxy.fullname" . }}-admin
  labels:
    {{- include "pertisk-eproxy.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ include "pertisk-eproxy.ingressClassName" . }}
  rules:
    - host: {{ .Values.adminIngress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pertisk-eproxy.fullname" . }}
                port:
                  number: {{ .Values.service.managementPort }}
  {{- if and .Values.adminIngress.tlsSecretName (ne (toString .Values.adminIngress.tlsSecretName) "") }}
  tls:
    - hosts:
        - {{ .Values.adminIngress.host }}
      secretName: {{ .Values.adminIngress.tlsSecretName }}
  {{- end }}
{{- end }}
