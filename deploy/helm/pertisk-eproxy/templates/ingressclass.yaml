{{- if .Values.ingressClassResource.enabled }}
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ include "pertisk-eproxy.ingressClassName" . }}
  labels:
    {{- include "pertisk-eproxy.labels" . | nindent 4 }}
  {{- if .Values.ingressClassResource.default }}
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
  {{- end }}
spec:
  controller: {{ .Values.ingressClassResource.controller }}
{{- end }}
