# Standard Ingress: admin UI on management port 9080.
# Apply after Helm install: kubectl apply -f ingress-admin-homelab.yaml -n pertisk-eproxy
# Set backend service name to your release Service (kubectl get svc -n pertisk-eproxy).
# TLS: use cert-manager + Cloudflare DNS (see cert-manager-README.md); then uncomment the tls block below.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pertisk-eproxy-admin
  namespace: pertisk-eproxy
spec:
  ingressClassName: pertisk-eproxy
  rules:
    - host: admin.orangepi.thaidevops.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pertisk-eproxy
                port:
                  number: 9080
  tls:
    - hosts:
        - admin.orangepi.thaidevops.co
      secretName: admin-orangepi-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pertisk-eproxy-admin-pertisk
  namespace: pertisk-eproxy
spec:
  ingressClassName: pertisk-eproxy
  rules:
    - host: admin.orangepi.pertisksoft.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pertisk-eproxy
                port:
                  number: 9080
  tls:
    - hosts:
        - admin.orangepi.pertisksoft.net
      secretName: admin-orangepi-pertisk-tls
