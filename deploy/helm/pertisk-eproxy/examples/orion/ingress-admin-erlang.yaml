# Admin UI via standard Ingress (management port 9080).
# DNS → controller LB; TLS Secret in same namespace (e.g. cert-manager).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pertisk-eproxy-admin
  namespace: pertisk-eproxy
spec:
  ingressClassName: pertisk-eproxy
  rules:
    - host: admin.arm.thaidevops.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pertisk-eproxy
                port:
                  number: 9080
  tls:
    - hosts:
        - admin.arm.thaidevops.co
      secretName: admin-arm-tls
