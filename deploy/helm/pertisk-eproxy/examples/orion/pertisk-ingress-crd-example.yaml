# PertiskIngress CRD (not reconciled by arm controller yet — documentation only).
# CRD example — not reconciled by pertisk-eproxy yet.
apiVersion: proxy.pertisk.tech/v1alpha1
kind: PertiskIngress
metadata:
  name: my-app
  namespace: default
spec:
  host: example.com
  ingressClassName: pertisk-eproxy
  backendRef:
    name: my-backend
  routes:
    - path: /
      pathType: Prefix
  tls:
    secretName: my-app-tls
    hosts:
      - example.com
