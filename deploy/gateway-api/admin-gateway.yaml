# Gateway API: wildcard listener for *.erlang.pertisk.com; HTTPRoute maps
# admin.erlang.pertisk.com → pertisk-eproxy management UI (port 9080).
#
# Use this for pertisk-eproxy (Erlang). For Rust pertisk-rproxy admin use
# deploy/gateway-api/admin-gateway.yaml in the pertisk-rproxy repo
# (admin.gateway.pertisk.com).
#
# Prerequisites:
#   - Gateway API CRDs in the cluster
#   - Helm: ingress.gatewayApiEnabled=true, gatewayClassResource.enabled=true
#   - TLS Secret admin-erlang-tls (*.erlang.pertisk.com)
#   - DNS admin.erlang.pertisk.com → pertisk-eproxy LoadBalancer
#
# Apply:
#   kubectl apply -f deploy/gateway-api/admin-gateway.yaml -n pertisk-eproxy
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: admin-gateway
  namespace: pertisk-eproxy
spec:
  gatewayClassName: pertisk-eproxy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.erlang.pertisk.com"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: admin-erlang-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-gateway
  namespace: pertisk-eproxy
  annotations:
    pertisk.io/gateway-class: pertisk-eproxy
spec:
  parentRefs:
    - name: admin-gateway
      sectionName: https
  hostnames:
    - admin.erlang.pertisk.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pertisk-eproxy
          port: 9080
